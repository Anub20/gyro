<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyroscopic Couple</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- 3D viewport -->
    <div class="viewport">
      <div class="wrap">
        <canvas id="c"></canvas>
        <div class="labels">
          <span class="lbl-w">→ ω &nbsp; spin axis</span>
          <span class="lbl-O">↑ Ω &nbsp; precession</span>
          <span class="lbl-C">→ C &nbsp; gyroscopic couple</span>
        </div>
      </div>
      <div class="info">
        <b>C = I · ω · Ω</b> &nbsp;|&nbsp;
        Couple acts perpendicular to both spin axis and precession axis
      </div>
    </div>

    <!-- Control panel -->
    <div class="panel">
      <div class="panel-title">Enter Values:</div>

      <div class="field">
        <input type="number" id="inp-I" placeholder="Moment of Inertia" min="0" step="0.1" />
        <span class="unit">kg·m²</span>
      </div>

      <div class="field">
        <input type="number" id="inp-rpm" placeholder="Spin Velocity" min="0" step="10" />
        <span class="unit">rpm</span>
      </div>

      <div class="field">
        <input type="number" id="inp-prec" placeholder="Precession Velocity" min="0" step="0.1" />
        <span class="unit">rad/s</span>
      </div>

      <button class="btn btn-orange" id="btn-calc">Calculate</button>

      <div class="result-box" id="result-box">Couple (C)</div>

      <button class="btn btn-orange" id="btn-apply">Apply</button>

      
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
